<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nightshift</title>
<style>
  :root {
    --ink:#14120f; --panel:#1c1916; --line:rgba(241,238,230,.12);
    --text:#f1eee6; --dim:rgba(241,238,230,.55);
    --busy:#ffb020; --idle:#3ddc97; --wait:#ff4757; --draft:#c77dff; --unk:#8b95a1;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--ink); color:var(--text);
    font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px; display:flex; flex-direction:column; overflow:hidden;
  }

  header {
    flex:0 0 auto; display:flex; align-items:center; gap:.9rem;
    padding:.5rem .9rem; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #201d19, var(--panel));
  }
  .brand { display:flex; align-items:center; gap:.45rem; font-weight:700;
           letter-spacing:.05em; flex:0 0 auto; }
  .brand .mark { width:9px; height:9px; border-radius:2px; background:var(--idle);
                 box-shadow:0 0 9px currentColor; transition:background .3s; }
  #hint { font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .counts { display:flex; gap:.4rem; margin-left:auto; align-items:center; flex:0 0 auto; }
  .cnt {
    display:flex; align-items:center; gap:.35rem; color:var(--dim); font-size:11px;
    background:rgba(241,238,230,.045); border:1px solid var(--line);
    border-radius:999px; padding:.12rem .5rem;
  }
  .cnt b { color:var(--text); font-variant-numeric:tabular-nums; font-weight:700; }
  .cnt.need { border-color:currentColor; }
  .cnt.need b { color:currentColor; }
  .swatch { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .lnk {
    display:flex; align-items:center; gap:.3rem; height:24px; padding:0 .55rem;
    border:1px solid var(--line); border-radius:6px; color:var(--dim);
    font-size:11px; text-decoration:none; letter-spacing:.02em;
    transition:color .12s, border-color .12s, background .12s;
  }
  .lnk:hover { color:var(--text); border-color:#4a443c; background:rgba(241,238,230,.06); }
  #fs, #nv {
    display:flex; align-items:center; justify-content:center; width:26px; height:24px;
    background:transparent; border:1px solid var(--line); color:var(--dim);
    border-radius:6px; padding:0; font:inherit; font-size:12px; cursor:pointer;
    transition:color .12s, border-color .12s, background .12s;
  }
  #fs:hover, #nv:hover { color:var(--text); border-color:#4a443c;
                         background:rgba(241,238,230,.06); }
  .beat { width:7px; height:7px; border-radius:50%; background:var(--idle);
          opacity:.25; transition:opacity .15s; }
  .beat.on { opacity:1; }

  #main { flex:1 1 auto; display:flex; min-height:0; }
  #stage { flex:1 1 auto; position:relative; display:flex; min-width:0;
           align-items:center; justify-content:center; padding:14px; min-height:0; }

  /* ---------- workspace rail ---------- */
  #nav {
    flex:0 0 auto; width:216px; overflow-y:auto; overflow-x:hidden;
    background:var(--panel); border-right:1px solid var(--line);
    padding:.5rem .35rem .8rem; transition:width .16s;
  }
  #nav.compact { width:44px; padding:.5rem .25rem .8rem; }
  #nav::-webkit-scrollbar { width:6px; }
  #nav::-webkit-scrollbar-thumb { background:rgba(241,238,230,.14); border-radius:3px; }
  .ws {
    background:rgba(241,238,230,.045); border-radius:6px;
    border-left:3px solid var(--unk);            /* the group's worst state */
    padding:.3rem .4rem .32rem; margin-bottom:.5rem;
  }
  .ws .wh { padding:0 .1rem .18rem; }
  .ws .wh .wp { font-size:9px; color:var(--dim); overflow:hidden;
                text-overflow:ellipsis; white-space:nowrap; }
  .ws .wh .wtop { display:flex; align-items:center; gap:.35rem; }
  .ws .wh .wn { font-size:11px; font-weight:700; color:var(--text); min-width:0;
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ws .wh .wc {
    margin-left:auto; display:flex; align-items:center; gap:.25rem; flex:0 0 auto;
    background:rgba(241,238,230,.1); border-radius:8px; padding:0 5px;
    font-size:9px; color:var(--dim); font-variant-numeric:tabular-nums;
  }
  .ws .row { margin-left:.1rem; }
  .dot { width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .dot.bg { background:transparent !important; box-shadow:inset 0 0 0 2px currentColor; }
  .row {
    display:flex; align-items:center; gap:.4rem; padding:.22rem .35rem;
    border-radius:4px; cursor:pointer; line-height:1.25;
  }
  .row:hover { background:rgba(241,238,230,.07); }
  .row.on { background:rgba(241,238,230,.1); }
  .row.here {                                   /* the pane you are sitting in */
    background:rgba(241,238,230,.1);
    box-shadow:inset 2px 0 0 var(--text);
  }
  .row.here .rn { color:var(--text); font-weight:700; }
  #nav.compact .row.here .dot { box-shadow:0 0 0 2px rgba(241,238,230,.6); }
  .row .txt { min-width:0; flex:1 1 auto; }
  .row .rn { font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .rn .pre { color:var(--dim); }           /* the part the folder already told you */
  .row .rs { font-size:9px; color:var(--dim); overflow:hidden;
             text-overflow:ellipsis; white-space:nowrap; }
  .row .tag { font-size:8px; color:var(--dim); border:1px solid var(--line);
              border-radius:3px; padding:0 3px; letter-spacing:.06em; }
  .more {
    display:flex; align-items:center; gap:.35rem; margin-left:.1rem;
    padding:.18rem .35rem; border-radius:4px; cursor:pointer;
    font-size:9px; color:var(--dim); letter-spacing:.02em;
  }
  .more:hover { background:rgba(241,238,230,.07); color:var(--text); }
  .row .go { flex:0 0 auto; font-size:11px; color:var(--dim); opacity:0; padding:0 2px; }
  .row:hover .go { opacity:1; }
  .row .go:hover { color:var(--text); }
  #nav.compact .ws { padding:.28rem 0; margin-bottom:.4rem; }
  #nav.compact .wh,
  #nav.compact .row .txt, #nav.compact .row .go { display:none; }
  #nav.compact .row { justify-content:center; padding:.25rem 0; margin-left:0; }
  #nav .none { color:var(--dim); font-size:10px; padding:.3rem .35rem; }
  #nav.compact .none { display:none; }
  #frame { position:relative; }
  canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges;
           border-radius:5px; box-shadow:0 14px 46px rgba(0,0,0,.6); }
  #overlay { position:absolute; inset:0; pointer-events:none; }

  .person { position:absolute; transform:translate(-50%,-50%);
            pointer-events:auto; cursor:pointer; }

  .plate {
    position:absolute; transform:translate(-50%,0); white-space:nowrap;
    text-align:center; line-height:1.3; pointer-events:auto; cursor:pointer;
  }
  .plate .nm { font-weight:700; font-size:11px; letter-spacing:.01em;
               text-shadow:0 1px 2px rgba(0,0,0,.75); }
  .plate .sub { font-size:9px; color:var(--dim); text-shadow:0 1px 2px rgba(0,0,0,.75); }
  .plate:hover .nm { text-decoration:underline; text-underline-offset:2px; }

  .roomtag {
    position:absolute; transform:translate(-50%,-50%); white-space:nowrap;
    display:flex; align-items:center; gap:.45rem; pointer-events:none;
  }
  .roomtag .rn { font-weight:700; font-size:11px; letter-spacing:.08em;
                 text-transform:uppercase; text-shadow:0 1px 2px rgba(0,0,0,.8); }
  .roomtag .rc { font-size:9px; color:var(--dim); }

  .bubble {
    position:absolute; transform:translate(-50%,-100%);
    max-width:190px; padding:.3rem .45rem; border-radius:5px;
    font-size:10px; line-height:1.35; white-space:normal; word-break:break-word;
    background:#2a2233; border:1px solid var(--draft); color:#efe4f6;
    box-shadow:0 3px 12px rgba(0,0,0,.5);
  }
  .bubble:after {
    content:""; position:absolute; left:50%; bottom:-5px; margin-left:-4px;
    width:0; height:0; border:4px solid transparent; border-top-color:var(--draft);
  }
  .bubble .tag { display:block; color:var(--draft); font-size:8px;
                 letter-spacing:.1em; text-transform:uppercase; margin-bottom:2px; }

  #tip {
    position:fixed; z-index:9; max-width:340px; padding:.5rem .6rem;
    background:#221e1a; border:1px solid var(--line); border-radius:6px;
    font-size:11px; line-height:1.5; box-shadow:0 8px 28px rgba(0,0,0,.6);
    display:none; pointer-events:none;
  }
  #tip .k { color:var(--dim); }
  #tip .snip { color:var(--dim); margin-top:.3rem; display:block;
               max-height:3.6em; overflow:hidden; }

  #toast {
    position:fixed; left:50%; bottom:22px; transform:translate(-50%,14px);
    background:#efe9dd; color:#14120f; padding:.45rem .8rem; border-radius:6px;
    font-size:11px; font-weight:700; opacity:0; transition:opacity .18s, transform .18s;
    pointer-events:none; z-index:10;
  }
  #toast.on { opacity:1; transform:translate(-50%,0); }

  #empty { position:absolute; inset:0; display:none; align-items:center;
           justify-content:center; color:var(--dim); font-size:12px; }
</style>
</head>
<body>

<header>
  <span class="brand"><i class="mark" id="mark"></i>nightshift</span>
  <span style="color:var(--dim)" id="hint">click a person to focus that pane &middot; click a desk to read the conversation</span>
  <span class="counts" id="counts"></span>
  <a class="lnk" id="talk" href="/talk" title="read and reply to any session (r)">talk &rarr;</a>
  <button id="nv" title="workspaces (n)">&#9776;</button>
  <button id="fs" title="fullscreen (f)">&#9974;</button>
  <span class="beat" id="beat"></span>
</header>

<div id="main">
  <aside id="nav"></aside>
  <div id="stage">
    <div id="frame">
      <canvas id="cv"></canvas>
      <div id="overlay"></div>
    </div>
    <div id="empty">nobody's in the office &mdash; no Claude Code sessions running</div>
  </div>
</div>

<div id="tip"></div>
<div id="toast"></div>

<script>
"use strict";

/* ---------- palette ---------- */
const C = {
  wall:"#7d8b93", wallHi:"#93a1a8", wallLo:"#6a777e",
  rail:"#5b666c", wains:"#66727a", wainsHi:"#78848c", skirt:"#4c565b",
  floorA:"#7a6650", floorB:"#7f6b55", floorC:"#75614c", seam:"#6a5744",
  rug:"#4a4a52", rugHi:"#5a5a64", rugEdge:"#3a3a41", rugMid:"#525260",
  deskTop:"#ad8a61", deskHi:"#c2a077", deskFace:"#8e6d4a", deskLo:"#7a5c3d",
  deskLeg:"#6b5035",
  chair:"#3b4149", chairHi:"#4b535c", chairLo:"#2e333a", wheel:"#23262b",
  bezel:"#23272c", bezelHi:"#343a41", bezelLo:"#17191d", screenOff:"#101820",
  keys:"#33383e", keyTop:"#464c53", metal:"#98a1a7",
  plant:"#4a7a52", plantHi:"#65975f", plantLo:"#39603f", pot:"#a2603f", potHi:"#bb7449",
  cooler:"#d3dde0", coolerTop:"#7fb3c4", board:"#e8e4d8", boardEdge:"#b6b0a0",
  paper:"#e5e0d2", ink:"#14120f", shadow:"rgba(0,0,0,.26)",
  couch:"#7a5a52", couchHi:"#8f6b61", couchLo:"#5e453f",
  print:"#c9cfd2", printHi:"#e2e7e9", printLo:"#8f979b",
  busy:"#ffb020", idle:"#3ddc97", wait:"#ff4757", draft:"#c77dff", unk:"#8b95a1",
  unread:"#5bc8ff", viewing:"#f1eee6"
};
const SKIN  = ["#eec09a","#d9a377","#b07d53","#8d5a3b","#f2d3b4","#6b4630"];
const HAIR  = ["#2b241e","#5f3b22","#c9a227","#8c3b2e","#39557a","#7a4f7d","#d9d3c8","#43302a"];
const SHIRT = ["#4a7a8c","#7a5c8c","#8c6b4a","#4a8c63","#8c4a5c","#5c6b8c","#6b7a4a","#8c5a3f"];
const MUG   = ["#d9534f","#4f8fd9","#e0c14f","#e8e4d8","#5fae7a"];

/* ---------- geometry (high-res pixel grid) ---------- */
let W = 1024;
let BLD = { x:0, y:0, w:1024, h:400 };
const DW = 150, ROWH = 224;
const ROOM = { wallH:140, pad:18, gap:16, deskGap:26, maxCols:3, seatY:46, tail:136 };
const LOUNGE = 96;
const URG = { waiting:0, draft:1, idle:2, busy:3, unknown:4 };
let H = 460, DT = 16;

const cv = document.getElementById("cv");
let ctx = cv.getContext("2d");
const overlay = document.getElementById("overlay");
const frame = document.getElementById("frame");
const tip = document.getElementById("tip");

/* ---------- tiny pixel toolkit ---------- */
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }
function rrect(x,y,w,h,r,c){                       // rounded block, pixel style
  px(x+r,y,w-2*r,h,c); px(x,y+r,w,h-2*r,c);
  if (r>1) { px(x+1,y+1,r-1,r-1,c); px(x+w-r,y+1,r-1,r-1,c);
             px(x+1,y+h-r,r-1,r-1,c); px(x+w-r,y+h-r,r-1,r-1,c); }
}
function frameRect(x,y,w,h,c){ px(x,y,w,1,c); px(x,y+h-1,w,1,c); px(x,y,1,h,c); px(x+w-1,y,1,h,c); }
function alphaBlock(x,y,w,h,c,a){ ctx.globalAlpha=a; px(x,y,w,h,c); ctx.globalAlpha=1; }
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function tone(hex,f){                              // darken (<1) / lighten (>1)
  const n = parseInt(hex.slice(1),16);
  const cl = v => Math.max(0, Math.min(255, Math.round(v)));
  const r = cl(((n>>16)&255)*f), g = cl(((n>>8)&255)*f), b = cl((n&255)*f);
  return "#" + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
function stateColor(s){ return s==="busy"?C.busy:s==="idle"?C.idle:s==="waiting"?C.wait:s==="draft"?C.draft:C.unk; }

/* ---------- live model ---------- */
let sessions = [];
let roster = [];                                        // desks + background agents
let lastRead = "";
let hoverName = "";                                     /* the character under the cursor */
let rooms = [];
let lastT = 0;

/* one room per tmux session: agents sharing a tmux name share an office */
function groupKey(s){
  return (s.where && s.where !== "-") ? s.where.split(":")[0] : (s.name || "?");
}
function packRooms(list, CW){
  const byKey = new Map();
  for (const s of list) {
    const k = groupKey(s);
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(s);
  }
  const keys = [...byKey.keys()].sort();
  const out = [];
  let x = ROOM.gap, y = ROOM.gap, bandH = 0, bandFrom = 0, widest = 0;
  const centreBand = (from, to, endX)=>{                 // slide the band into the middle
    const shift = Math.round((CW - (endX - ROOM.gap)) / 2) - ROOM.gap;
    if (shift <= 0) return;
    for (let i=from; i<to; i++) {
      out[i].x += shift;
      for (const st of out[i].seats) st.x += shift;
    }
  };
  for (const k of keys) {
    const members = byKey.get(k).slice()
      .sort((a,b)=> (a.where+a.name) < (b.where+b.name) ? -1 : 1);   // stable seats
    const cols = Math.min(members.length, ROOM.maxCols);
    const rws  = Math.ceil(members.length / cols);
    const w = cols*DW + (cols-1)*ROOM.deskGap + ROOM.pad*2;
    const h = ROOM.wallH + ROOM.seatY + (rws-1)*ROWH + ROOM.tail;
    if (x > ROOM.gap && x + w > CW - ROOM.gap) {
      centreBand(bandFrom, out.length, x);
      bandFrom = out.length; x = ROOM.gap; y += bandH + ROOM.gap; bandH = 0;
    }
    const seats = members.map((m,i)=>({
      s: m,
      x: x + ROOM.pad + (i % cols)*(DW + ROOM.deskGap),
      y: y + ROOM.wallH + ROOM.seatY + ((i / cols)|0)*ROWH
    }));
    let worst = 9;
    for (const m of members) worst = Math.min(worst, URG[m.state] === undefined ? 4 : URG[m.state]);
    const urgState = Object.keys(URG).find(kk=>URG[kk]===worst) || "unknown";
    out.push({ key:k, x, y, w, h, cols, rows:rws, seats, members, urg:stateColor(urgState) });
    x += w + ROOM.gap;
    bandH = Math.max(bandH, h); widest = Math.max(widest, w);
  }
  centreBand(bandFrom, out.length, x);
  return { rooms: out, H: Math.max(420, y + bandH + ROOM.gap + LOUNGE), wide: widest };
}

/* choose the canvas width whose packing best matches the window's shape */
function buildRooms(list){
  for (const k of [...games.keys()]) if (!list.some(m=>m.name === k)) games.delete(k);
  if (!list.length) { rooms = []; H = 420; return; }
  const stage = document.getElementById("stage");
  const availW = Math.max(320, stage.clientWidth - 28);
  const availH = Math.max(240, stage.clientHeight - 28);
  const target = (availW / availH) * .94;   // margins add width back
  const probe = packRooms(list, 4000);                  // widest single room
  const floorW = Math.max(720, probe.wide + ROOM.gap*2);
  let best = null;
  for (let cand = floorW; cand <= floorW + 3200; cand += 40) {
    const r = packRooms(list, cand);
    const err = Math.abs(Math.log((cand / r.H) / target));
    if (!best || err < best.err) best = { err, W: cand, rooms: r.rooms, H: r.H };
    if (cand / r.H > target * 1.8) break;
  }
  const mx = Math.max(70, Math.min(330, Math.round(best.W * .13)));
  const mt = Math.max(48, Math.min(190, Math.round(best.H * .11)));
  const mb = Math.max(30, Math.min(120, Math.round(best.H * .07)));
  for (const r of best.rooms) {
    r.x += mx; r.y += mt;
    for (const st of r.seats) { st.x += mx; st.y += mt; }
  }
  W = best.W + mx*2; H = best.H + mt + mb;
  BLD = { x: mx - 12, y: mt - 12, w: best.W + 24, h: best.H + 24 };
  rooms = best.rooms;
}
function resize(){
  if (cv.height !== H || cv.width !== W) { cv.width = W; cv.height = H; }
  const stage = document.getElementById("stage");
  const avail = { w: stage.clientWidth - 28, h: stage.clientHeight - 28 };
  let scale = Math.min(avail.w / W, avail.h / H);
  if (scale >= 2) scale = Math.floor(scale);        // keep whole pixels when there is room
  scale = Math.max(.5, Math.min(3, scale));
  frame.style.width = (W*scale) + "px";
  frame.style.height = (H*scale) + "px";
  cv.style.width = (W*scale) + "px";
  cv.style.height = (H*scale) + "px";
  return scale;
}

/* ---------- scenery ---------- */
function skyColors(){
  const d = new Date(), h = d.getHours() + d.getMinutes()/60;
  if (h < 5.5)  return ["#101828","#1d2942","#0d1220"];
  if (h < 7.5)  return ["#3f4d70","#d09070","#2a3450"];
  if (h < 17)   return ["#5f9dc4","#b3d8e6","#3d6f92"];
  if (h < 19.5) return ["#bd6f4c","#f0bb75","#7a4a45"];
  if (h < 21)   return ["#3a4568","#6f5875","#262d47"];
  return ["#101828","#1d2942","#0d1220"];
}

/* ---------- the night city behind the building ---------- */
let bgCanvas = null, bgKey = "", bgBlinks = [], bgNeon = [];

function bgTowers(baseY, minH, maxH, minW, maxW, body, edge, lit, litRate, gap, neon){
  let x = -30, i = 0;
  while (x < W + 30) {
    const s = hash("bg" + body + i);
    const tw = minW + (s % (maxW - minW));
    const th = minH + ((s>>>6) % (maxH - minH));
    const top = baseY - th;
    px(x, top, tw, th, body);
    px(x, top, tw, 2, edge);
    px(x + tw - 3, top, 3, th, tone(body, .78));
    if (s % 4 === 0) { px(x+3, top-4, tw-6, 4, tone(body,1.1)); }          // parapet
    if (s % 5 === 1) { px(x + (tw>>1) - 8, top-9, 16, 9, tone(body,.9));   // rooftop box
                       px(x + (tw>>1) - 6, top-13, 4, 5, tone(body,.9)); }
    if (s % 3 === 0) {                                                      // antenna + blinker
      const ax = x + (tw>>1) - 1, ay = top - 22;
      px(ax, ay, 2, 22, tone(body,1.15));
      bgBlinks.push({ x: ax-1, y: ay-3, p: (s % 7) * 380 });
    }
    for (let wy = top + 7; wy < baseY - 8; wy += 8)
      for (let wx = x + 4; wx < x + tw - 6; wx += 7) {
        const k = hash("bw" + wx + "_" + wy);
        if ((k % 100) < litRate) {
          const c = (k % 11 === 0) ? "#bcd6ff" : ((k % 7 === 0) ? "#fff0c0" : lit);
          px(wx, wy, 4, 4, c);
          alphaBlock(wx-1, wy-1, 6, 6, c, .12);
        }
      }
    if (neon && s % 6 === 2) {                                              // neon sign on the facade
      const nc = ["#ff4d8d","#4fe1ff","#ffd24f","#8f6bff"][(s>>>3) % 4];
      const nx = x + 4, ny = top + 16 + ((s>>>9) % Math.max(8, th - 40));
      const nw = Math.max(8, tw - 10);
      bgNeon.push({ x:nx, y:ny, w:nw, c:nc, p:(s % 5) * 500 });
      px(nx, ny, nw, 3, nc); alphaBlock(nx-2, ny-3, nw+4, 9, nc, .22);
    }
    x += tw + gap + (s % 12);
    i++;
  }
}

function backdropCity(){
  const P = rainyPalette();
  const key = W + "x" + H + "/" + P.sky[0];
  if (bgCanvas && bgKey === key) return bgCanvas;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const main = ctx; ctx = c.getContext("2d");
  bgBlinks = []; bgNeon = [];
  const night = P.night;
  const sky = night ? ["#05070f","#0b1226","#1b1b3a","#3a2444"] : ["#38404d","#4d5765","#6b7280","#8b8778"];
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,sky[0]); g.addColorStop(.42,sky[1]); g.addColorStop(.78,sky[2]); g.addColorStop(1,sky[3]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  const horizon = H - LOUNGE;
  for (let i=0;i<9;i++) {                                    // low cloud bands lit from below
    const s = hash("cl"+i);
    const cy = 20 + (s % Math.max(40, (horizon*.55)|0));
    const cw = 180 + (s % 320), cx = (s>>>7) % Math.max(1, W);
    alphaBlock(cx, cy, cw, 14 + (s%16), night ? "#2a2b4d" : "#9aa2ad", .30);
    alphaBlock(cx+20, cy-8, cw-60, 10, night ? "#232445" : "#aab2bd", .22);
  }
  const gl = ctx.createLinearGradient(0,horizon-150,0,horizon);
  gl.addColorStop(0,"rgba(0,0,0,0)"); gl.addColorStop(1, night ? "rgba(255,175,95,.26)" : "rgba(255,255,255,.12)");
  ctx.fillStyle = gl; ctx.fillRect(0,horizon-150,W,150);

  const cap = h => Math.min(h, Math.max(90, (H*.62)|0));
  bgTowers(horizon - 16, 50, cap(150), 16, 34, night?"#0e1730":"#4a5462", night?"#16224a":"#5b6674", "#ffd88a", 18, 5, false);
  bgTowers(horizon - 6,  80, cap(230), 26, 52, night?"#0a1024":"#3b4450", night?"#121a3a":"#4a5462", "#ffcf7a", 26, 7, true);
  bgTowers(horizon + 4, 110, cap(320), 40, 78, night?"#05080f":"#2b323c", night?"#0c1224":"#39404b", "#ffc46a", 20, 12, true);

  alphaBlock(0, horizon-8, W, 8, night ? "#1a1330" : "#6b7280", .40);
  ctx = main; bgCanvas = c; bgKey = key;
  return c;
}

/* ---------- the city outside: always raining ---------- */
function rainyPalette(){
  const hr = new Date().getHours(), night = hr >= 19 || hr < 6;
  return night
    ? { night:true,  sky:["#141b2b","#20293f","#0c1119"], tower:"#0d1422",
        towerB:"#161f33", lit:"#ffd88a" }
    : { night:false, sky:["#59626e","#79838f","#3d444e"], tower:"#2f3742",
        towerB:"#3d4653", lit:"#e6dcb2" };
}
let cityTile = null, cityKey = "";
function drawTowers(x0, baseY, w, P, near){
  let x = x0 - 24, i = 0;
  const col = near ? P.towerB : P.tower;
  while (x < x0 + w) {
    const s = hash("tw" + (near?"n":"f") + i);
    const tw = (near ? 20 : 14) + (s % (near ? 26 : 18));
    const th = (near ? 22 : 14) + ((s>>>5) % (near ? 40 : 30));
    px(x, baseY - th, tw, th, col);
    px(x, baseY - th, tw, 2, tone(col, 1.35));
    px(x + tw - 2, baseY - th, 2, th, tone(col, .8));
    if (s % 5 === 0) { px(x + (tw>>1) - 1, baseY - th - 10, 2, 10, col);
                       px(x + (tw>>1) - 2, baseY - th - 12, 4, 3, "#ff5a5a"); }
    for (let wy = baseY - th + 6; wy < baseY - 5; wy += 6)
      for (let wx = x + 3; wx < x + tw - 4; wx += 5) {
        const k = hash("w" + wx + "," + wy);
        if ((k % 10) < (near ? 5 : 4)) px(wx, wy, 3, 3, k % 3 ? P.lit : tone(P.lit, .8));
      }
    x += tw + 3 + (s % 9); i++;
  }
}
function city(){                                   // cached: towers are static, rain is not
  const P = rainyPalette(), key = P.sky[0] + P.lit;
  if (cityTile && cityKey === key) return cityTile;
  const c = document.createElement("canvas"); c.width = 640; c.height = 72;
  const main = ctx; ctx = c.getContext("2d");
  ctx.globalAlpha = .7; drawTowers(0, 72, 640, P, false); ctx.globalAlpha = 1;  // far layer, hazier
  drawTowers(0, 72, 640, P, true);
  ctx = main; cityTile = c; cityKey = key;
  return c;
}
function drawRain(x,y,w,h,t,n,alpha,speed){
  ctx.globalAlpha = alpha; ctx.fillStyle = "#d5e4f2";
  for (let i=0;i<n;i++){
    const s = hash("rn"+i);
    const rx = x + (s % w);
    const ry = y + (((s>>>9) % (h+30)) + (t/1000)*(speed + (s%140))) % (h+30) - 15;
    const len = 4 + (s % 4);
    if (ry + len > y && ry < y + h) {
      ctx.fillRect(rx|0, Math.max(y,ry)|0, 1, Math.min(len, y+h-ry)|0);
      ctx.fillRect((rx-1)|0, Math.max(y,ry+len)|0, 1, Math.min(3, y+h-ry-len)|0);
    }
  }
  ctx.globalAlpha = 1;
}
function lightning(t){                              // rare flash, same for every window
  const per = 13000, k = t % per;
  if (k > 260) return 0;
  return k < 90 ? k/90 : (k < 150 ? 1 : Math.max(0, 1 - (k-150)/110)) * .8;
}

function drawWindow(wx,wy,ww,wh,t){
  const P = rainyPalette();
  t = t || 0;
  px(wx-6,wy-6,ww+12,wh+14,C.bezelLo);                      // outer frame
  px(wx-4,wy-4,ww+8,wh+10,"#cfd6d3");
  px(wx-4,wy-4,ww+8,2,"#e6ebe7");

  ctx.save(); ctx.beginPath(); ctx.rect(wx,wy,ww,wh); ctx.clip();
  const g = ctx.createLinearGradient(0,wy,0,wy+wh);
  g.addColorStop(0,P.sky[0]); g.addColorStop(.55,P.sky[1]); g.addColorStop(1,P.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(wx,wy,ww,wh);

  const tile = city(), cw = Math.min(ww,600), off = hash("c"+wx+wy) % (640 - cw);
  ctx.drawImage(tile, off, Math.max(0,72-wh), cw, Math.min(wh,72), wx, wy+Math.max(0,wh-72), cw, Math.min(wh,72));

  const fl = lightning(t);
  if (fl > 0) alphaBlock(wx,wy,ww,wh,"#cfe0f5", fl*.55);
  alphaBlock(wx,wy+wh-8,ww,8,P.sky[2],.35);
  drawRain(wx,wy,ww,wh,t, Math.max(10,(ww*wh)/95|0), .30, 620);
  for (let i=0;i<7;i++){                                    // drops running down the glass
    const s2 = hash("dp"+wx+i);
    const dx2 = wx + 3 + (s2 % Math.max(1,ww-6));
    const dy2 = wy + ((s2>>>7) % wh + (t/1000)*(14 + s2%22)) % wh;
    alphaBlock(dx2, dy2|0, 1, 3+(s2%4), "#e8f2ff", .30);
    alphaBlock(dx2, (dy2|0)+4, 1, 1, "#ffffff", .18);
  }
  ctx.globalAlpha=.08; ctx.fillStyle="#ffffff";              // reflection on the pane
  ctx.beginPath(); ctx.moveTo(wx,wy+wh); ctx.lineTo(wx+ww*.42,wy);
  ctx.lineTo(wx+ww*.66,wy); ctx.lineTo(wx+ww*.16,wy+wh); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();

  px(wx+((ww/2)|0)-1,wy,3,wh,"#cfd6d3"); px(wx,wy+((wh/2)|0)-1,ww,3,"#cfd6d3");
  px(wx-8,wy+wh+4,ww+16,5,"#b9c0bd"); px(wx-8,wy+wh+4,ww+16,2,"#d7dcd8");   // sill
  if (fl > 0) alphaBlock(wx-10,wy+wh+9,ww+20,10,"#cfe0f5",fl*.25);
}

function drawClock(cx,cy,r){
  const t = new Date();
  ctx.fillStyle = C.bezelLo; ctx.beginPath(); ctx.arc(cx,cy,r+2,0,7); ctx.fill();
  ctx.fillStyle = C.boardEdge; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
  ctx.fillStyle = C.board;     ctx.beginPath(); ctx.arc(cx,cy,r-3,0,7); ctx.fill();
  for (let i=0;i<12;i++){
    const a = i/12*Math.PI*2;
    px(cx + Math.sin(a)*(r-6) - 1, cy - Math.cos(a)*(r-6) - 1, 2, 2, i%3 ? "#9aa3a8" : C.ink);
  }
  const hand = (ang,len,wdt,col)=>{ ctx.strokeStyle=col; ctx.lineWidth=wdt; ctx.lineCap="butt";
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.sin(ang)*len, cy-Math.cos(ang)*len); ctx.stroke(); };
  hand(((t.getHours()%12)+t.getMinutes()/60)/12*Math.PI*2, r-10, 3, C.ink);
  hand(t.getMinutes()/60*Math.PI*2, r-5, 2, C.ink);
  hand(t.getSeconds()/60*Math.PI*2, r-4, 1, "#c05a4a");
  px(cx-1,cy-1,2,2,C.ink);
}

function drawRoomWall(r,t){

    px(r.x, y, r.w, Math.min(plank, r.y+r.h-y), i%3===0 ? C.floorB : (i%3===1 ? C.floorA : C.floorC));
    alphaBlock(r.x, y, r.w, 1, "#000000", .07);

    for (let x=r.x+((i%2)?70:10); x<r.x+r.w; x+=190) alphaBlock(x, y+2, 1, plank-2, "#000000", .05);
  }
  for (let i=0; i<r.rows; i++) {                          // rug under each row of desks

function drawBackdrop(t){

  ctx.drawImage(backdropCity(), 0, 0);

/* ---------- an idle agent has nothing better to do ---------- */
const TCOLS = 9, TROWS = 12;
const PIECES = [
  { c:"#4fd6e6", r:["0000111100000000","0010001000100010"] },                                       // I
  { c:"#e8c84f", r:["0110011000000000"] },                                                          // O
  { c:"#c77dff", r:["0100111000000000","0100011001000000","0000111001000000","0100110001000000"] }, // T
  { c:"#5fd08a", r:["0110110000000000","0100011000100000"] },                                       // S
  { c:"#ff6b6b", r:["1100011000000000","0010011001000000"] },                                       // Z
  { c:"#5b8dee", r:["1000111000000000","0110010001000000","0000111000100000","0100010011000000"] }, // J
  { c:"#ffa04f", r:["0010111000000000","0100010001100000","0000111010000000","1100010001000000"] }  // L
];
const games = new Map();

function cellsOf(p, rot){
  const m = p.r[rot % p.r.length], out = [];
  for (let i=0;i<16;i++) if (m[i] === "1") out.push([i%4, (i/4)|0]);
  return out;
}
function fits(g, cells, ox, oy){
  for (const [cx,cy] of cells) {
    const x = ox+cx, y = oy+cy;
    if (x < 0 || x >= TCOLS || y >= TROWS) return false;
    if (y >= 0 && g.grid[y][x]) return false;
  }
  return true;
}
function rnd(g){ g.seed = (Math.imul(g.seed, 1664525) + 1013904223) >>> 0; return g.seed >>> 8; }

function tetris(a){
  let g = games.get(a.name);
  if (!g) {
    g = { grid: Array.from({length:TROWS}, ()=>new Array(TCOLS).fill(0)),
          cur:null, acc:0, tick:170, seed:(hash(a.name)||7), flash:0, lines:0, next:0 };
    for (let y=TROWS-3; y<TROWS; y++) {                  // some debris already stacked up
      let holes = 0;
      for (let x=0; x<TCOLS; x++) {
        const on = (rnd(g) % 10) < 7;
        g.grid[y][x] = on ? 1 + (rnd(g) % PIECES.length) : 0;
        if (!on) holes++;
      }
      if (!holes) g.grid[y][rnd(g) % TCOLS] = 0;          // never start with a full row
    }
    games.set(a.name, g);
  }
  g.acc += DT;
  if (g.flash > 0) { g.flash -= DT; g.acc = 0; return g; }
  let guard = 0;
  while (g.acc >= g.tick && guard++ < 8) {
    g.acc -= g.tick;
    if (!g.cur) {
      const pi = g.next % PIECES.length;
      g.next = rnd(g) % PIECES.length;
      const p = PIECES[pi], rot = rnd(g) % p.r.length;
      const cells = cellsOf(p, rot);
      let wide = 0; for (const c of cells) wide = Math.max(wide, c[0]+1);
      g.cur = { pi, rot, x:3, y:-1, tx: rnd(g) % (TCOLS - wide) };
      if (!fits(g, cells, 3, 0)) {                       // topped out, sweep the board
        g.grid = Array.from({length:TROWS}, ()=>new Array(TCOLS).fill(0));
        g.lines = 0; g.flash = 260;
      }
      continue;
    }
    const p = PIECES[g.cur.pi], cells = cellsOf(p, g.cur.rot);
    if (g.cur.x !== g.cur.tx) {                          // shuffle toward the chosen column
      const dir = g.cur.tx > g.cur.x ? 1 : -1;
      if (fits(g, cells, g.cur.x + dir, g.cur.y)) g.cur.x += dir; else g.cur.tx = g.cur.x;
    }
    if (fits(g, cells, g.cur.x, g.cur.y + 1)) g.cur.y++;
    else {
      for (const [cx,cy] of cells) {
        const y = g.cur.y + cy, x = g.cur.x + cx;
        if (y >= 0 && y < TROWS) g.grid[y][x] = g.cur.pi + 1;
      }
      let cleared = 0;
      for (let y=TROWS-1; y>=0; y--)
        if (g.grid[y].every(v=>v)) { g.grid.splice(y,1); g.grid.unshift(new Array(TCOLS).fill(0)); cleared++; y++; }
      if (cleared) { g.lines += cleared; g.flash = 170; }
      g.cur = null;
    }
  }
  return g;
}

function drawTetris(sx,sy,sw,sh,a,col){
  const g = tetris(a), cell = 4, bw = TCOLS*cell, bh = TROWS*cell;
  const bx = sx + 4, by = sy + ((sh - bh)/2 | 0);
  px(sx,sy,sw,sh,"#0a0f16");
  px(bx-3, by-3, bw+6, bh+6, "#1d2b38");                  // cabinet around the well
  frameRect(bx-3, by-3, bw+6, bh+6, "#415a70");
  px(bx, by, bw, bh, "#080d13");
  for (let x=1;x<TCOLS;x++) alphaBlock(bx+x*cell, by, 1, bh, "#ffffff", .035);
  for (let y=1;y<TROWS;y++) alphaBlock(bx, by+y*cell, bw, 1, "#ffffff", .035);
  const cellAt = (x,y,c)=>{ px(bx+x*cell, by+y*cell, cell, cell, tone(c,.62));
                            px(bx+x*cell, by+y*cell, cell-1, cell-1, c);
                            px(bx+x*cell, by+y*cell, cell-1, 1, tone(c,1.4)); };
  for (let y=0;y<TROWS;y++) for (let x=0;x<TCOLS;x++)
    if (g.grid[y][x]) cellAt(x, y, PIECES[g.grid[y][x]-1].c);
  if (g.cur) {
    const p = PIECES[g.cur.pi];
    for (const [cx,cy] of cellsOf(p, g.cur.rot)) if (g.cur.y + cy >= 0) cellAt(g.cur.x + cx, g.cur.y + cy, p.c);
  }
  if (g.flash > 0) alphaBlock(bx, by, bw, bh, "#ffffff", Math.min(.5, g.flash/340));
  const nx = bx + bw + 8;                                  // next piece + lines cleared
  px(nx, by, 22, 20, "#101922"); frameRect(nx, by, 22, 20, "#415a70");
  const np = PIECES[g.next % PIECES.length];
  for (const [cx2,cy2] of cellsOf(np, 0)) {
    px(nx+3+cx2*4, by+5+cy2*4, 4, 4, tone(np.c,.62));
    px(nx+3+cx2*4, by+5+cy2*4, 3, 3, np.c);
  }
  px(nx, by+25, 22, 1, "#415a70");
  for (let i=0; i<Math.min(6, g.lines); i++) px(nx, by+29+i*4, 16, 3, col);
}

/* ---------- screens ---------- */
function drawScreen(sx,sy,sw,sh,a,t,col){
  const st = a.state;
  if (st === "unknown") {
    px(sx,sy,sw,sh,"#0c1116"); px(sx+sw/2-8,sy+sh/2,16,2,"#2a3138");
  } else if (st === "busy") {
    px(sx,sy,sw,sh,"#0d1520");
    px(sx,sy,sw,7,"#16202c");                                        // tab bar
    px(sx+2,sy+1,18,5,"#22303f"); px(sx+22,sy+1,14,5,"#1a2531"); px(sx+38,sy+1,12,5,"#1a2531");
    px(sx+2,sy+2,18,1,col);
    px(sx,sy+7,10,sh-7,"#0a1119");                                   // gutter
    const off = (t/70) % 8;
    for (let i=0;i<12;i++){
      const ly = sy + 10 + ((i*8 + 96 - off) % (sh-16));
      const seed = hash(a.name+i);
      const ind = 2 + (seed % 4) * 3;
      const lw = 8 + (seed % 34);
      px(sx+3, ly, 4, 1, "#2c3a48");                                 // line number
      px(sx+11+ind, ly, Math.min(lw, sw-14-ind), 2, i%4===0 ? col : (i%3 ? "#4a6a86" : "#7f9fb8"));
      if (i%5===2) px(sx+13+ind+lw, ly, 6, 2, tone(col,.8));
    }
    const cb = (t/380|0)%2;
    if (cb) px(sx+18, sy+sh-12, 5, 3, "#ffffff");
    px(sx+2,sy+sh-5,sw-4,3,"#16202c");                               // status bar
    px(sx+2,sy+sh-5,Math.max(4,((t/26)%(sw-4))|0),3,col);
  } else if (st === "draft") {
    px(sx,sy,sw,sh,"#0f1018");
    for (let i=0;i<5;i++) px(sx+6, sy+8+i*7, 12 + (hash(a.name+"d"+i)%30), 2, "#2e3346");
    px(sx+6, sy+sh-16, sw-14, 12, "#191a26");                        // prompt box
    frameRect(sx+6, sy+sh-16, sw-14, 12, col);
    const w2 = 6 + (hash(a.name)%22);
    px(sx+9, sy+sh-11, w2, 2, "#cbb6dc");
    if ((t/450|0)%2) px(sx+11+w2, sy+sh-13, 2, 6, col);              // caret
  } else if (st === "waiting") {
    px(sx,sy,sw,sh,"#160f10");
    const p = (Math.sin(t/260)+1)/2;
    ctx.globalAlpha = .35 + p*.6; frameRect(sx,sy,sw,sh,col);
    frameRect(sx+1,sy+1,sw-2,sh-2,col); ctx.globalAlpha = 1;
    for (let i=0;i<3;i++) px(sx+8, sy+9+i*7, 16 + (hash(a.name+"w"+i)%26), 2, "#4a3338");
    const bx = sx+sw/2-9, by = sy+sh/2-4;                            // "?" glyph
    px(bx+2,by-6,12,4,col); px(bx+12,by-4,4,6,col); px(bx+7,by+1,6,4,col);
    px(bx+7,by+6,5,2,col); px(bx+7,by+10,5,4,col);
  } else {                                                            // idle: playing tetris
    drawTetris(sx, sy, sw, sh, a, col);
  }
  alphaBlock(sx,sy,sw,2,"#ffffff",.06);
  ctx.globalAlpha = .05; ctx.fillStyle = "#ffffff";                   // glass reflection
  ctx.beginPath(); ctx.moveTo(sx,sy+sh); ctx.lineTo(sx+sw*.42,sy);
  ctx.lineTo(sx+sw*.62,sy); ctx.lineTo(sx+sw*.2,sy+sh); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------- one workstation, nobody ever leaves it ---------- */

  const hy = dy + 3 + lean, hx = cx - 13;
  const shy = hy + 30;

  px(cx-6, hy+26, 12, 8, tone(skin,.86));                     // neck
  px(cx-7, hy+26, 1, 8, tone(skin,.6)); px(cx+6, hy+26, 1, 8, tone(skin,.6));
  const sEdge = tone(shirt,.55), sHi = tone(shirt,1.18), sLo = tone(shirt,.82);
  px(dx+51, shy+1, 48, 4, sEdge); px(dx+47, shy+4, 56, 4, sEdge);   // sloped shoulders
  px(dx+43, shy+7, 64, 29, sEdge);
  px(dx+52, shy+2, 46, 3, shirt); px(dx+48, shy+5, 54, 3, shirt);
  px(dx+44, shy+8, 62, 27, shirt);
  px(dx+52, shy+2, 46, 2, sHi); px(dx+48, shy+5, 9, 2, sHi); px(dx+93, shy+5, 9, 2, sHi);
  px(dx+44, shy+8, 6, 27, sLo); px(dx+100, shy+8, 6, 27, sLo);
  px(cx-10, shy, 20, 5, sHi); px(cx-8, shy+1, 16, 3, tone(shirt,1.32));   // collar
  const al = typing ? 2 : 0, ar = typing ? 0 : 2;             // arms angling in to the keys
  const armY = idle ? shy+16 : shy+9;
  [[dx+38, al, 1], [dx+104, ar, -1]].forEach(([axx, bob, dir])=>{
    px(axx, armY+bob, 8, 16, tone(shirt,.92));                // upper arm
    px(axx, armY+bob, 8, 3, tone(shirt,1.1));
    if (idle) { px(axx+1, armY+16, 6, 9, skin); }             // hands in the lap
    else { px(axx+dir*2, armY+13+bob, 8, 9, tone(shirt,.86)); // forearm, angled inward
           px(axx+dir*4, armY+20+bob, 7, 7, skin); }          // hand at the desk edge
  });

  if (st === "waiting") {                                     // turned around, hand up
    rrect(hx, hy+2, 26, 27, 3, tone(skin,.55));               // silhouette edge
    rrect(hx+1, hy+3, 24, 25, 3, skin);                       // face
    rrect(hx, hy, 26, 10, 3, hair); px(hx, hy+6, 4, 12, hair); px(hx+22, hy+6, 4, 12, hair);
    px(hx+3, hy, 20, 2, tone(hair,1.3));
    px(hx+4, hy+8, 8, 2, tone(hair,.85));
    px(hx+6, hy+13, 4, 4, C.ink); px(hx+16, hy+13, 4, 4, C.ink);
    px(hx+6, hy+10, 4, 2, tone(hair,.9)); px(hx+16, hy+10, 4, 2, tone(hair,.9));
    px(hx+10, hy+21, 7, 2, tone(skin,.72));
    px(hx-3, hy+13, 4, 8, skin); px(hx+25, hy+13, 4, 8, skin);
    const wv = (t/300|0)%2 ? 0 : 2;                           // small wave
    px(dx+104, shy+2, 9, 12, tone(shirt,.92));                // upper arm, out to the side
    px(dx+109-wv, shy-10, 8, 14, tone(shirt,.86));            // forearm up
    px(dx+108-wv, shy-20, 10, 11, skin);                      // hand
    px(dx+108-wv, shy-22, 3, 4, skin); px(dx+112-wv, shy-23, 3, 5, skin);
    px(dx+115-wv, shy-22, 3, 4, skin);
  } else {
    rrect(hx-1, hy+1, 28, 28, 4, tone(hair,.6));              // silhouette edge
    rrect(hx, hy+2, 26, 26, 3, hair);                         // back of the head
    px(hx+3, hy+1, 20, 3, tone(hair,1.3));
    px(hx+4, hy+4, 16, 3, tone(hair,1.15));
    px(hx+16, hy+4, 5, 6, tone(hair,1.24));                   // crown whorl
    px(hx+4, hy+24, 18, 3, tone(hair,.78));                   // nape
    if (style === 1) { px(hx+8, hy-8, 11, 10, hair); px(hx+9, hy-8, 9, 2, tone(hair,1.3)); }
    if (style === 2) { px(hx-3, hy+8, 32, 26, hair); px(hx-3, hy+8, 3, 26, tone(hair,.85)); }
    px(hx-3, hy+13, 4, 8, skin); px(hx+25, hy+13, 4, 8, skin);   // ears
    px(hx+7, hy+22, 12, 4, tone(hair,.82));
  }
  if (cans) {
    px(hx-5, hy+8, 6, 14, C.chairLo); px(hx+25, hy+8, 6, 14, C.chairLo);
    px(hx-4, hy-2, 34, 4, C.chairHi); px(hx-5, hy+2, 3, 8, C.chairHi); px(hx+28, hy+2, 3, 8, C.chairHi);
    px(hx-4, hy+11, 3, 4, busy ? col : C.chairLo);
  }

  /* --- chair, drawn over the torso the way a chair back sits between you and them --- */
  const cyTop = shy + 22 + (idle ? 3 : 0);
  rrect(dx+48, cyTop, 54, 28, 4, C.chair);
  rrect(dx+51, cyTop+3, 48, 22, 3, C.chairHi);
  px(dx+51, cyTop+3, 48, 3, tone(C.chairHi,1.2));
  px(dx+56, cyTop-4, 38, 4, C.chair);                         // head rest lip
  px(dx+58, cyTop-3, 34, 2, col);                             // status accent
  px(dx+40, cyTop+9, 10, 6, C.chairLo); px(dx+100, cyTop+9, 10, 6, C.chairLo);
  px(dx+69, cyTop+28, 12, 14, C.chairLo);
  px(cx-27, cyTop+42, 54, 5, C.chair); px(cx-4, cyTop+40, 8, 8, C.chair);
  [-27, -2, 22].forEach(o=> px(cx+o, cyTop+46, 6, 5, C.wheel));
  alphaBlock(cx-32, cyTop+51, 64, 5, "#000000", .22);

  /* --- idle: a slow "z" drifting up, nobody wandering the room --- */
  if (idle) {
    const zp = (t/1500) % 3;
    if (zp < 2.2) {
      const zy = dy + 58 - zp*15, za = .6 - zp*.24, zs = 5, zx = cx - 48;
      ctx.globalAlpha = Math.max(0, za); ctx.fillStyle = C.idle;
      ctx.fillRect(zx, zy, zs*2, 2); ctx.fillRect(zx, zy+zs*2-2, zs*2, 2);
      for (let i=0;i<zs;i++) ctx.fillRect(zx+(zs*2-2-i*2), zy+2+i*((zs*2-4)/zs), 2, 2);
      ctx.globalAlpha = 1;
    }
  }

  /* --- waiting: the '!' nobody can miss --- */
  if (st === "waiting") {
    const p = Math.sin(t/240) * 3;
    const bxx = cx - 62, byy = dy - 78 + p;
    rrect(bxx, byy, 18, 24, 3, C.wait);
    px(bxx+6, byy+22, 6, 5, C.wait);
    px(bxx+7, byy+5, 4, 10, "#ffffff"); px(bxx+7, byy+17, 4, 3, "#ffffff");
  }

  /* --- monitor glow spilling onto the desk --- */
  if (busy || st === "draft" || st === "waiting") {
    const g = ctx.createRadialGradient(cx, dy-56, 4, cx, dy-56, 96);
    g.addColorStop(0, col + "26"); g.addColorStop(1, col + "00");
    ctx.fillStyle = g; ctx.fillRect(dx-24, dy-104, DW+48, 150);
  }
  if (lit || here) {                            // a pixel reticle: hover, or you
    const x0 = dx+32, y0 = dy-18, bw = 86, bh = 96, L = 10, T = 2;
    ctx.fillStyle = lit ? col : "#f1eee655";
    [[x0, y0, 1, 1], [x0+bw, y0, -1, 1], [x0, y0+bh, 1, -1], [x0+bw, y0+bh, -1, -1]]
      .forEach(([bx, by, sx2, sy2])=>{
        ctx.fillRect(sx2 > 0 ? bx : bx-L, sy2 > 0 ? by : by-T, L, T);
        ctx.fillRect(sx2 > 0 ? bx : bx-T, sy2 > 0 ? by : by-L, T, L);
      });
  }

  if (gone) ctx.globalAlpha = 1;
}

/* ---------- frame ---------- */
function draw(t){
  DT = Math.min(80, t - lastT || 16); lastT = t;
  const scale = resize();
  ctx.clearRect(0,0,W,H);
  drawBackdrop(t);
  drawBuilding(t);
  drawLounge(t);

  const hits = [];
  for (const r of rooms) {
    drawRoom(r, t);
    for (const seat of r.seats)
      hits.push({ a: seat.s, x: seat.x + DW/2, y: seat.y - 30,
                  body:  { x: seat.x + DW/2, y: seat.y + 31, w: 86, h: 92 },
                  label: { x: seat.x + DW/2, y: seat.y + 112 } });
  }

  // vignette
  const v = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*.42, W/2, H/2, Math.max(W,H)*.72);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.35)");
  ctx.fillStyle = v; ctx.fillRect(0,0,W,H);

  layout(hits, scale);
  requestAnimationFrame(draw);
}

/* ---------- html overlay ---------- */
let plateCache = "";
function layout(hits, scale){
  const key = hits.map(h=>h.a.name+h.a.state+h.a.quiet_str+h.a.draft+(h.label.x|0)+(h.label.y|0)).join("|")
            + "@" + H + "/" + rooms.map(r=>r.key+r.members.length+r.urg).join(",");
  if (key === plateCache) return;
  plateCache = key;
  overlay.innerHTML = "";
  for (const r of rooms) {                                  // one sign per tmux session
    const sg = document.createElement("div");
    sg.className = "roomtag";
    sg.style.left = ((r.x + r.w/2)/W*100) + "%";
    sg.style.top  = ((r.y + 11)/H*100) + "%";
    sg.innerHTML = '<span class="rn" style="color:'+r.urg+'">'+esc(r.key)+'</span>'
                 + '<span class="rc">'+r.members.length+(r.members.length>1?" agents":" agent")+'</span>';
    overlay.appendChild(sg);
  }
  for (const h of hits) {
    const a = h.a, col = stateColor(a.state);
    const b = document.createElement("div");            // the character itself: read
    b.className = "person"; b.title = "focus " + a.name + "'s pane";
    b.style.left   = (h.body.x/W*100) + "%";
    b.style.top    = (h.body.y/H*100) + "%";
    b.style.width  = (h.body.w/W*100) + "%";
    b.style.height = (h.body.h/H*100) + "%";
    b.addEventListener("click", ()=> focusPane(a));
    // the glow is the whole hover story here - the panel would just cover the room
    b.addEventListener("mouseenter", ()=>{ hoverName = a.name; hideTip(); });
    b.addEventListener("mouseleave", ()=>{ hoverName = ""; });
    overlay.appendChild(b);
    const p = document.createElement("div");
    p.className = "plate"; p.dataset.name = a.name;
    p.style.left = (h.label.x/W*100) + "%";
    p.style.top  = (h.label.y/H*100) + "%";
    const spot = (a.where && a.where !== "-") ? (a.where.split(":")[1] || a.where) : a.name;
    p.innerHTML = '<div class="nm" style="color:'+labelColor(a)+'">'+esc(stateLabel(a))+'</div>'
                + '<div class="sub">'+esc(spot)+' &middot; '+esc(a.quiet_str)+'</div>';
    p.addEventListener("click", e=> (e.shiftKey||e.altKey) ? focusPane(a)
                                 : openTalk(a, e.metaKey || e.ctrlKey));
    p.addEventListener("mouseenter", e=>showTip(e,a));
    p.addEventListener("mousemove", e=>moveTip(e));
    p.addEventListener("mouseleave", hideTip);
    overlay.appendChild(p);
  }
}
/* an agent under ~/.../f168-loop-agent is usually named f168-loop-agent-9f:
   dim the half the folder already told you, keep the rest bright */
function splitName(name, leaf){
  const n = String(name).toLowerCase(), l = String(leaf).toLowerCase();
  if (!leaf || n === l || !n.startsWith(l)) return ["", name];
  return [name.slice(0, leaf.length), name.slice(leaf.length)];
}
/* `busy` is the registry's word; "working" is what it looks like. An idle
   session holding output you have not opened yet reads as "unread". */
function stateLabel(a){
  if (a.watching) return "viewing";               // this is the pane you are in
  if (a.unread && (a.state === "idle" || a.state === "unknown")) return "unread";
  return a.state === "busy" ? "working" : a.state;
}
function labelColor(a){
  if (a.watching) return C.viewing;
  return (a.unread && (a.state === "idle" || a.state === "unknown"))
    ? C.unread : stateColor(a.state);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function showTip(e,a){
  tip.innerHTML =
      '<div><b style="color:'+stateColor(a.state)+'">'+esc(a.name)+'</b></div>'
    + '<div><span class="k">state </span>'+esc(stateLabel(a))+'  <span class="k">tmux </span>'+esc(a.where)+'</div>'
    + '<div><span class="k">cwd   </span>'+esc(a.cwd)+'</div>'
    + '<div><span class="k">up '+esc(a.age)+' &middot; quiet '+esc(a.quiet_str)+'</span></div>'
    + (a.draft ? '<span class="snip" style="color:'+C.draft+'">unsent: '+esc(a.draft)+'</span>'
               : (a.snip ? '<span class="snip">'+esc(a.snip)+'</span>' : ''));
  tip.style.display = "block"; moveTip(e);
}
function moveTip(e){
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const r = tip.getBoundingClientRect();
  if (x + r.width  > innerWidth  - 8) x = e.clientX - r.width  - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tip.style.left = x+"px"; tip.style.top = y+"px";
}
function hideTip(){ tip.style.display = "none"; }

let toastT = 0;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"), 2200);
}

/* the transcript lives on the same server, at /talk - same tab, so talk's
   "office" link takes you straight back; cmd/ctrl-click still opens a tab */
function openTalk(a, newTab){
  const url = "/talk" + (a && a.sid ? "?sid=" + a.sid : "");
  if (newTab) {
    lastRead = a && a.sid ? a.sid : lastRead;
    window.open(url, "nightshift-talk");
    navCache = ""; drawNav();                     // move the rail highlight
    return;
  }
  location.href = url;
}

function markSeen(a){
  if (!a || !a.sid) return;
  fetch("/api/talk/seen", {method:"POST", headers:{"Content-Type":"application/json"},
                           body: JSON.stringify({sid: a.sid})}).catch(()=>{});
}

async function focusPane(a){
  const sess = (a.where||"").split(":")[0];
  if (!a.pane) { toast(a.name + " isn't in tmux or herdr"); return; }
  try {
    const r = await fetch("/api/focus", {method:"POST", headers:{"Content-Type":"application/json"},
                                         body: JSON.stringify({pane:a.pane})});
    const j = await r.json();
    if (!r.ok) { toast("could not focus: " + (j.error||r.status)); return; }
    markSeen(a);                                  // you looked: clear its unread
    if (a.mux !== "tmux") { toast(a.where + " focused"); return; }
    const cmd = "tmux attach -t " + sess;
    try { await navigator.clipboard.writeText(cmd); toast(a.where + " focused · copied “" + cmd + "”"); }
    catch { toast(a.where + " focused"); }
  } catch (e) { toast("server unreachable"); }
}

/* ---------- polling ---------- */
const beat = document.getElementById("beat");
async function poll(){
  try {
    const r = await fetch("/api/sessions", {cache:"no-store"});
    const j = await r.json();
    sessions = j.sessions || [];
    roster = j.all || sessions;                       // older servers send desks only
    buildRooms(sessions);
    drawNav();
    document.getElementById("empty").style.display = sessions.length ? "none" : "flex";
    frame.style.display = sessions.length ? "block" : "none";
    counts();
    beat.classList.add("on"); setTimeout(()=>beat.classList.remove("on"), 180);
  } catch (e) { /* server gone; keep last frame */ }
}
function counts(){
  const n = {}; for (const s of sessions) n[s.state] = (n[s.state]||0)+1;
  const need = (n.waiting||0)+(n.draft||0)+(n.idle||0);
  const unread = sessions.filter(s=> s.unread && (s.state === "idle" || s.state === "unknown")).length;
  const row = [["waiting",C.wait,"waiting"],["draft",C.draft,"draft"],
               ["idle",C.idle,"idle"],["busy",C.busy,"working"]]
    .filter(([k])=>n[k])
    .map(([k,c,lbl])=>'<span class="cnt"><i class="swatch" style="background:'+c+'"></i><b>'+n[k]+'</b> '+lbl+'</span>')
    .join("")
    + (unread ? '<span class="cnt"><i class="swatch" style="background:'+C.unread+'"></i><b>'
                + unread + '</b> unread</span>' : "");
  const worst = n.waiting ? C.wait : n.draft ? C.draft : n.idle ? C.idle
              : n.busy ? C.busy : C.unk;                 // what the room needs first
  document.getElementById("counts").innerHTML = row +
    (need ? '<span class="cnt need" style="color:'+worst+'"><b>'+need+'</b> need you</span>' : "");
  document.getElementById("mark").style.background = sessions.length ? worst : C.unk;
}

/* ---------- the workspace rail: every running agent, grouped by cwd ---------- */
const nav = document.getElementById("nav");
let navCache = "";
/* Claude Code keeps spare background agents warm: alive, idle, and untouched
   for hours. They are worth keeping (one may be doing real work) but not worth
   a row each, so past this they fold into a single line per workspace. */
const BG_STALE = 3600 * 1000;
const staleBg = a => a.kind === "bg" && a.state === "idle" &&
                     (a.quiet || 0) * 1000 > BG_STALE;
let bgOpen = {};                                  /* workspaces you unfolded */

function wsGroups(){
  const by = new Map();
  for (const s of roster) {
    const k = s.cwd || "?";
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(s);
  }
  const urg = a => URG[a.state] === undefined ? 4 : URG[a.state];
  const out = [...by.entries()].map(([path, list])=>{
    list.sort((a,b)=> urg(a) - urg(b) || (a.name < b.name ? -1 : 1));
    return { path, list, worst: Math.min(...list.map(urg)) };
  });
  out.sort((a,b)=> a.worst - b.worst || (a.path < b.path ? -1 : 1));
  return out;
}
function drawNav(){
  const groups = wsGroups();
  const key = groups.map(g=> g.path + ":" + (bgOpen[g.path] ? "+" : "") + g.list.map(a=>
    a.name+a.state+a.quiet_str+a.kind+(a.watching?"@":"")+(a.sid===lastRead?"*":"")
  ).join(",")).join("|");
  if (key === navCache) return;
  navCache = key;
  nav.innerHTML = "";
  if (!groups.length) {
    const n = document.createElement("div");
    n.className = "none"; n.textContent = "no sessions";
    return nav.appendChild(n);
  }
  for (const g of groups) {
    const box = document.createElement("div");
    box.className = "ws"; box.title = g.path;
    const worstCol = stateColor(Object.keys(URG).find(k=>URG[k]===g.worst) || "unknown");
    box.style.borderLeftColor = worstCol;
    const parts = g.path.split("/").filter(Boolean);
    const home = g.path === "~";                       // a bare ~ reads as nothing
    const leaf = home ? "home" : (parts.pop() || g.path);
    const parent = home ? "~" : (parts.length ? parts.join("/") + "/" : "");
    const head = document.createElement("div");
    head.className = "wh";
    head.innerHTML = (parent ? '<div class="wp">'+esc(parent)+'</div>' : '')
                   + '<div class="wtop"><span class="wn">'+esc(leaf)+'</span>'
                   + '<span class="wc"><i class="dot" style="background:'+worstCol+'"></i>'
                   + g.list.length+'</span></div>';
    box.appendChild(head);
    const stale = bgOpen[g.path] ? [] : g.list.filter(staleBg);
    for (const a of g.list) {
      if (stale.includes(a)) continue;
      const col = stateColor(a.state), bg = a.kind === "bg";
      const nm = splitName(a.name, home ? "" : leaf);
      const row = document.createElement("div");
      row.className = "row" + (a.sid && a.sid === lastRead ? " on" : "")
                            + (a.watching ? " here" : "");
      row.title = a.name + " \u2014 " + stateLabel(a);
      const rc = labelColor(a);
      row.innerHTML = '<i class="dot'+(bg?" bg":"")+'" style="background:'+rc+';color:'+rc+'"></i>'
                    + '<div class="txt"><div class="rn">'
                    + (nm[0] ? '<span class="pre">'+esc(nm[0])+'</span>' : '')
                    + esc(nm[1])+'</div>'
                    + '<div class="rs">'+esc(stateLabel(a))+' &middot; '+esc(a.quiet_str)
                    + (bg ? ' <span class="tag">bg</span>' : '')+'</div></div>';
      const go = document.createElement("span");     // the transcript is always there
      go.className = "go"; go.textContent = "\u2261";
      go.title = "read " + a.name + "'s conversation";
      go.addEventListener("click", e=>{ e.stopPropagation(); openTalk(a, e.metaKey||e.ctrlKey); });
      row.appendChild(go);
      // same as clicking the person: the row takes you to the pane, and an agent
      // with no pane of its own can only be read
      row.addEventListener("click", e=> (e.shiftKey||e.altKey || !a.pane)
                                      ? openTalk(a, e.metaKey || e.ctrlKey) : focusPane(a));
      row.addEventListener("mouseenter", e=>{ hoverName = a.name; showTip(e,a); });
      row.addEventListener("mousemove", e=>moveTip(e));
      row.addEventListener("mouseleave", ()=>{ hoverName = ""; hideTip(); });
      box.appendChild(row);
    }
    if (stale.length) {                           // one line for the warm spares
      const more = document.createElement("div");
      more.className = "more";
      more.title = stale.map(a=> a.name).join("\n");
      more.innerHTML = '<span>&#8250;</span><span>+' + stale.length +
                       ' idle bg</span>';
      more.addEventListener("click", ()=>{ bgOpen[g.path] = true; navCache = ""; drawNav(); });
      box.appendChild(more);
    }
    nav.appendChild(box);
  }
}
function setNav(mode){
  nav.classList.toggle("compact", mode === "compact");
  try { localStorage.setItem("nightshift.nav", mode); } catch (e) {}
  setTimeout(()=>{ plateCache=""; buildRooms(sessions); }, 190);   // the floor refits
}
function toggleNav(){ setNav(nav.classList.contains("compact") ? "full" : "compact"); }
try { if (localStorage.getItem("nightshift.nav") === "compact") nav.classList.add("compact"); }
catch (e) {}
document.getElementById("nv").addEventListener("click", toggleNav);

function toggleFull(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
}
document.getElementById("fs").addEventListener("click", toggleFull);
addEventListener("keydown", e=>{
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === "f") toggleFull();
  if (e.key === "r") openTalk(null);
  if (e.key === "n") toggleNav();
});
/* focusing a pane raises the terminal over this window, and a covered tab has
   its animation frame and timers throttled to a crawl - so catch up the moment
   it comes back instead of waiting out the next poll */
function wake(){ if (!document.hidden) { plateCache = ""; lastT = 0; poll(); } }
addEventListener("visibilitychange", wake);
addEventListener("focus", wake);

addEventListener("resize", ()=>{ plateCache=""; buildRooms(sessions); });
addEventListener("fullscreenchange", ()=>{ plateCache=""; setTimeout(()=>buildRooms(sessions), 60); });
poll(); setInterval(poll, 2000);
requestAnimationFrame(draw);
</script>
</body>
</html>
