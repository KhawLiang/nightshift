[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift"
version = "0.2.0"
description = "A pixel office showing every Claude Code session on this Mac: who is working, who is waiting on you"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []          # stdlib only, on purpose

[project.scripts]
nightshift = "nightshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nightshift = ["*.html"]
