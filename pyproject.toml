[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift"
version = "0.3.0"
description = "A pixel office and a live conversation view for every Claude Code session on this Mac"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []          # stdlib only, on purpose

[project.scripts]
nightshift = "nightshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nightshift = ["*.html"]
