[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-office"
version = "0.1.0"
description = "Pixel-art office + terminal status board for every Claude Code session on this machine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []          # stdlib only, on purpose

[project.scripts]
cc-office = "ccoffice.office:main"
cc-fleet  = "ccoffice.fleet:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccoffice = ["*.html"]
